<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 160px; font-family: sans-serif; padding: 10px; margin: 0; text-align: center; }
    h4 { margin: 0 0 8px 0; color: #333; font-size: 14px; }
    input[type="color"] { width: 100%; height: 35px; border-radius: 4px; border: 1px solid #ccc; cursor: pointer; margin-bottom: 8px; box-sizing: border-box; }
    button { width: 100%; padding: 8px; border-radius: 4px; border: none; background: #719cbf; color: white; cursor: pointer; font-weight: bold; font-size: 12px; }
    button:hover { background: #5595da; }
  </style>
</head>
<body>
  <h4>Pick Highlight Color</h4>
  <input type="color" id="colorSelect" value="#ffeb3b">
  
  <button id="downloadBtn">📥 Export Highlights</button>

  <script src="popup.js"></script>
</body>
</html>
